name: Playwright Python End-to-End Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 1: Build the Docker Image using the Dockerfile in your repo root
    - name: Build Docker Image
      run: docker build -t playwright-tests .

    # Step 2: Run the container normally (WITHOUT any -v mounts)
    - name: Run Playwright Tests inside Container
      run: |
        docker run --name test-runner \
          --network host \
          --shm-size=2gb \
          playwright-tests

    # Step 3: Extract the generated report directory directly from the container
    - name: Extract Report from Container
      if: always()
      run: |
        docker cp test-runner:/app/playwright-report ./playwright-report

    # Step 4: Upload the HTML report artifact generated by the extraction step
    - name: Upload Test Report Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-html-report
        path: playwright-report/report.html
        retention-days: 30
